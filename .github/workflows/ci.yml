name: Gateway checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.12", "3.13", "3.14"]
    services:
      redis:
        image: redis:7.4
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      GATEWAY_TEST_REDIS_URL: redis://127.0.0.1:6379/15
      UV_PYTHON: ${{ matrix.python }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          version: "0.13.4"
      - run: uv sync --locked --python "${{ matrix.python }}" --group dev --extra bus
      - run: uv run --no-sync ruff check src tests scripts/export_schemas.py scripts/check_django_authority.py
      - run: uv run --no-sync ruff format --check src tests scripts/export_schemas.py scripts/check_django_authority.py
      - run: uv run --no-sync mypy
      - run: uv run --no-sync python scripts/export_schemas.py --check
      - run: uv run --no-sync pytest -q
      - run: uv build
  authority-compatibility:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      UV_PYTHON: "3.14"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: Leydotpy/synq
          ref: 8000bc062579b760fb373387d5945243a568ea59
          path: synq-compatibility
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78
        with:
          version: "0.13.4"
      - working-directory: synq-compatibility
        run: uv run --frozen --with "$GITHUB_WORKSPACE" python "$GITHUB_WORKSPACE/scripts/check_django_authority.py" --synq .
  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: docker compose config --quiet
      - run: docker compose -f compose.yaml -f compose.dev.yaml config --quiet
      - run: docker build -t jrtc-signalling:ci .
      - run: docker run --rm jrtc-signalling:ci jrtc-signalling --check-config
      - name: Container startup and shutdown smoke
        run: |
          docker run -d --name gateway-smoke --read-only --cap-drop ALL -p 127.0.0.1:8765:8765 jrtc-signalling:ci
          python - <<'PY'
          import time, urllib.error, urllib.request
          deadline = time.monotonic() + 20
          while True:
              try:
                  with urllib.request.urlopen('http://127.0.0.1:8765/health/live', timeout=1) as response:
                      assert response.status == 200
                      break
              except OSError:
                  if time.monotonic() >= deadline:
                      raise
                  time.sleep(0.2)
          try:
              urllib.request.urlopen('http://127.0.0.1:8765/health/ready', timeout=2)
          except urllib.error.HTTPError as error:
              assert error.code == 503
          else:
              raise AssertionError('Scaffold unexpectedly ready')
          PY
          docker stop --time 15 gateway-smoke
          docker logs gateway-smoke | cat
      - name: Cleanup container
        if: always()
        run: docker rm -f gateway-smoke || true
