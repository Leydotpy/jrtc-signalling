[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "jrtc-signalling"
version = "0.1.0"
description = "Standalone Synq WebRTC signalling gateway"
requires-python = ">=3.12,<3.15"
readme = "README.md"
dependencies = ["jsonschema>=4.26,<5"]

[dependency-groups]
dev = [
  "build>=1.6,<2",
  "mypy>=1.20,<2",
  "pytest>=9.2,<10",
  "ruff>=0.17,<1",
  "types-jsonschema>=4.26,<5",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
jrtc_signalling = ["py.typed", "schemas/v1/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-config --strict-markers"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "C4", "SIM", "RUF"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src/jrtc_signalling"]
